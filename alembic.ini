# Alembic configuration.
#
# The database URL is NOT set here: alembic/env.py reads it from the app settings
# (DATABASE_URL), so credentials never live in this file. Tests override it with
# `config.set_main_option("sqlalchemy.url", ...)`.
#
# No [loggers] sections on purpose: alembic runs in-process at API startup
# (app/db/migrate.py) and must not reconfigure the application's logging.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =
