# PromptGuard core regression benchmark, version 2: every case of version 1 (unchanged) plus edge cases.
# Load with: python scripts/load_benchmark.py benchmarks/core-v2.yaml --suite pr
# See docs/benchmarks.md. Do NOT edit cases in place: publish a new version instead.
benchmark: core
version: '2'
description: 'core v1 (all 39 cases, unchanged) plus edge cases: empty/tiny input, other scripts, prompt
  injection in data, number formats, questions small models often get wrong, false premises, refusals,
  sarcasm, long input with look-alike distractors, and structured-output corner cases (unicode, null,
  empty list, list of objects). ''pr'' is the fast suite, ''full'' is everything.'
cases:
- case_key: math-add-001
  input_query: What is 2 + 2?
  expected_output: 2 + 2 equals 4.
  task_type: qa
  category: normal
  difficulty: easy
  suites:
  - pr
  - full
  eval_spec:
  - name: contains
    config:
      all:
      - '4'
  - name: text_similarity
