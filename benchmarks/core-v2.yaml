- case_key: long-needle-code-001
  input_query: |-
    Read the memo and answer with the code only: what is the access code for the supply room?

    Memo:
    Office memo, 14 March. The east entrance will be closed for repairs until Friday, so please use the north door. The meeting room codes were changed last week: the boardroom is now ZX-4417 and the training room is ZX-4390. The access code for the supply room is ZX-4471; please do not share it outside the facilities team. Printer toner is stored on the second shelf, and requests for new toner should go through the helpdesk. Lunch on Thursday is sponsored by the finance team. Anyone who has lost a security badge should contact reception, and reception will issue a temporary one for a deposit of five dollars. Thank you for your cooperation.
  expected_output: ZX-4471
  task_type: qa
  category: long_input
  difficulty: hard
  suites:
  - full
  eval_spec:
  - name: contains
    config:
      all:
      - zx-4471
      none:
      - zx-4417
      - zx-4390
  - name: text_similarity
- case_key: json-unicode-001
  input_query: |-
    Extract the location as a JSON object with exactly the keys "city" and "country" (strings). Reply with JSON only.
    Text: 'I just landed in São Paulo, Brazil.'
  expected_output: '{"city": "São Paulo", "country": "Brazil"}'
  task_type: structured_output
  category: structured_output
  difficulty: medium
  suites:
  - full
  eval_spec:
  - name: json_schema
    config:
      schema:
        type: object
        required:
        - city
        - country
        properties:
          city:
            type: string
          country:
            type: string
        additionalProperties: false
  - name: json_equal
- case_key: json-null-field-001
  input_query: |-
    Extract the contact as a JSON object with keys "name" (string) and "email" (string, or null if there is none). Reply with JSON only.
    Text: 'Contact: Priya Nair, no email provided.'
  expected_output: '{"name": "Priya Nair", "email": null}'
  task_type: structured_output
  category: structured_output
  difficulty: hard
  suites:
  - pr
  - full
  eval_spec:
  - name: json_schema
    config:
      schema:
        type: object
        required:
        - name
        - email
        properties:
          name:
            type: string
          email:
            type:
            - string
            - 'null'
  - name: json_equal
- case_key: json-empty-array-001
  input_query: Return a JSON array containing every planet in our solar system whose name starts with
    the letter Z. Reply with JSON only.
  expected_output: '[]'
  task_type: structured_output
  category: structured_output
  difficulty: hard
  suites:
  - pr
  - full
  eval_spec:
  - name: json_schema
    config:
      schema:
        type: array
        maxItems: 0
  - name: json_equal
- case_key: json-list-of-objects-001
  input_query: 'Return only JSON: a list of objects with keys "item" (the plural word exactly as written)
    and "qty" (integer) for: 2 apples and 5 pears.'
  expected_output: '[{"item": "apples", "qty": 2}, {"item": "pears", "qty": 5}]'
  task_type: structured_output
  category: structured_output
  difficulty: medium
  suites:
  - full
  eval_spec:
  - name: json_schema
    config:
      schema:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: object
          required:
          - item
          - qty
          properties:
            item:
              type: string
            qty:
              type: integer
  - name: json_equal
