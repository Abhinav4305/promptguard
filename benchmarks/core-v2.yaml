    Extract the invoice as a JSON object with keys "invoice_number" (string), "total" (number) and "currency" (string). Reply with JSON only.
    Text: 'Invoice INV-2041: total due 149.50 EUR'
  expected_output: '{"invoice_number": "INV-2041", "total": 149.5, "currency": "EUR"}'
  task_type: structured_output
  category: structured_output
  difficulty: hard
  suites:
  - full
  eval_spec:
  - name: json_schema
    config:
      schema:
        type: object
