# Simulated model answers for benchmarks/core-v2.yaml. NOT output of any real model.
#
# Each case has four hand-written answers:
#   good         a correct answer in the benchmark's own wording (the 'baseline model')
#   paraphrase   a CORRECT answer worded differently (a harmless change that must not block a release)
