# Simulated model answers for benchmarks/core-v1.yaml. NOT output of any real model.
#
# Each case has four hand-written answers:
#   good         a correct answer in the benchmark's own wording (the 'baseline model')
#   paraphrase   a CORRECT answer worded differently (a harmless change that must not block a release)
#   wrong_close  an INCORRECT answer that is textually close to the reference (hard for text similarity)
#   wrong_far    an INCORRECT answer worded very differently from the reference
# scripts/measure_gate.py replays them through the real executor, evaluators and comparator.
# tests/test_gate_measurement.py checks every label against the benchmark's own correctness checks.
math-add-001:
  good: 2 + 2 equals 4.
  paraphrase: 'The answer is four: 4.'
  wrong_close: 2 + 2 equals 5.
  wrong_far: Probably around twenty, but I can't be sure.
