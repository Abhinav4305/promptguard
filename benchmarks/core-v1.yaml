# PromptGuard core regression benchmark, version 1.
# Load with: python scripts/load_benchmark.py benchmarks/core-v1.yaml --suite pr
# See docs/benchmarks.md. Do NOT edit cases in place: publish a new version instead.
benchmark: core
version: '1'
description: 'PromptGuard core regression benchmark. ''pr'' suite = fast gate for pull requests; ''full''
  = every case. A published version is immutable: change a case by publishing version 2.'
cases:
- case_key: math-add-001
  input_query: What is 2 + 2?
  expected_output: 2 + 2 equals 4.
  task_type: qa
  category: normal
  difficulty: easy
  suites:
  - pr
  - full
  eval_spec:
  - name: contains
    config:
      all:
      - '4'
  - name: text_similarity
