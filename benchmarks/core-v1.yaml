- case_key: json-person-001
  input_query: |-
    Extract the person's details as a JSON object with exactly the keys "name" (string) and "age" (integer). Reply with JSON only.
    Text: 'Alice Johnson is 30 years old and lives in Boston.'
  expected_output: '{"name": "Alice Johnson", "age": 30}'
  task_type: structured_output
  category: structured_output
  difficulty: medium
  suites:
  - pr
  - full
  eval_spec:
  - name: json_schema
    config:
      schema:
        type: object
        required:
        - name
        - age
        properties:
          name:
            type: string
          age:
            type: integer
        additionalProperties: false
  - name: json_equal
- case_key: json-colours-001
  input_query: Return a JSON array containing the three primary colours of light (red, green, blue) as
    lowercase strings, in the order red, green, blue. Reply with JSON only.
  expected_output: '["red", "green", "blue"]'
  task_type: structured_output
  category: structured_output
  difficulty: easy
  suites:
  - full
  eval_spec:
  - name: json_schema
    config:
      schema:
        type: array
        items:
          type: string
        minItems: 3
        maxItems: 3
  - name: json_equal
- case_key: json-invoice-001
  input_query: |-
    Extract the invoice as a JSON object with keys "invoice_number" (string), "total" (number) and "currency" (string). Reply with JSON only.
    Text: 'Invoice INV-2041: total due 149.50 EUR'
  expected_output: '{"invoice_number": "INV-2041", "total": 149.5, "currency": "EUR"}'
  task_type: structured_output
  category: structured_output
  difficulty: hard
  suites:
  - full
  eval_spec:
  - name: json_schema
    config:
      schema:
        type: object
        required:
        - invoice_number
        - total
        - currency
        properties:
          invoice_number:
            type: string
          total:
            type: number
          currency:
            type: string
  - name: json_equal
    config:
      number_tolerance: 0.001
