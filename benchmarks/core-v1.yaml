- case_key: long-needle-cat-001
  input_query: |-
    Read the text and answer in one short sentence: what is the name of the lighthouse keeper's cat?

    Text:
    The island of Marrow Point lies eleven miles off the northern coast. For almost two centuries a lighthouse has stood on its eastern cliff, and each keeper has lived in the small stone cottage at its base. The current keeper, Odalys Brennan, took over the post after her father retired. She rises before dawn, checks the lamp, records the weather in a leather logbook, and feeds the cottage's only other resident, an elderly ginger cat named Biscuit. Supply boats arrive every second Thursday with flour, lamp oil and mail. During storms the island is cut off completely, and the keeper has been known to go four days without speaking to another person. Visitors are rare, though a group of birdwatchers camps on the western shore each spring to count the nesting puffins. Last winter the old foghorn was replaced with a quieter electronic model, which the villagers on the mainland say they miss more than they expected.
  expected_output: The cat is named Biscuit.
  task_type: qa
  category: long_input
  difficulty: medium
  suites:
  - full
  eval_spec:
  - name: contains
    config:
      all:
      - biscuit
  - name: text_similarity
- case_key: long-needle-bridge-001
  input_query: |-
    Read the text and answer in one short sentence: in what year was the bridge completed?

    Text:
    Surveyors first proposed a crossing of the Alder River in 1851, but the town council rejected the plan as too expensive. A second proposal followed in 1869, and after years of fundraising the foundation stones were finally laid in 1878. Work was interrupted in 1881 when a flood swept away part of the scaffolding, and again in 1884 when the main contractor went bankrupt. The bridge, a three-arch structure of grey limestone, was completed in 1887 and opened by the mayor at a public ceremony attended by nearly four thousand people. It was widened for motor traffic in 1923 and closed to vehicles altogether in 1996, when a new road bridge was built half a mile downstream. Today the old bridge is used only by walkers and cyclists, and it is lit every evening by lamps modelled on the originals.
  expected_output: The bridge was completed in 1887.
  task_type: qa
  category: long_input
  difficulty: hard
  suites:
  - full
  eval_spec:
  - name: contains
    config:
      all:
      - '1887'
  - name: text_similarity
